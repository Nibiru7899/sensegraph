[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensegraph"
version = "0.1.0"
description = "Reproducible chart understanding baseline research"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.3",
  "Pillow>=10", "numpy>=1.26,<3", "sentencepiece>=0.2", "protobuf>=4",
  "PyYAML>=6", "safetensors>=0.4", "pytest>=8"
]

[project.scripts]
sensegraph = "sensegraph.cli:main"
sensegraph-structure = "sensegraph.structural_cli:main"

[project.optional-dependencies]
structural = ["matplotlib==3.10.8", "torch-geometric==2.7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
